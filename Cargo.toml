[workspace]
resolver = "2"
members = [
    "crates/stagcrest-protocol",
    "crates/stagcrest-storage",
    "crates/stagcrest-world",
    "crates/stagcrest-mesh",
    "crates/stagcrest-circuit",
    "crates/stagcrest-mod-sdk",
    "crates/stagcrest-mod-server",
    "crates/stagcrest-mod-client",
    "crates/stagcrest-net",
    "crates/stagcrest-server",
    "crates/stagcrest-client",
    "crates/stagcrest-render",
    "mods/stagcrest-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_state",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_ui_render",
    "bevy_sprite_render",
    "bevy_winit",
    "bevy_render",
    "bevy_shader",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_text",
    "bevy_sprite",
    "bevy_picking",
    "ui_picking",
    "system_clipboard",
    "system_font_discovery",
    "multi_threaded",
    "tonemapping_luts",
    "zstd_rust",
    "x11",
    "wayland",
] }
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasmi = "0.32"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9"
bytemuck = { version = "1", features = ["derive"] }
redb = "2"
lz4_flex = "0.11"
slab = "0.4"
lru = "0.12"
postcard = { version = "1.1", features = ["alloc"] }
tokio = { version = "1", features = [
    "net",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
    "io-util",
    "signal",
] }
clap = { version = "4", features = ["derive"] }
socket2 = "0.5"
futures-lite = "2.6"

stagcrest-protocol = { path = "crates/stagcrest-protocol" }
stagcrest-storage = { path = "crates/stagcrest-storage" }
stagcrest-world = { path = "crates/stagcrest-world" }
stagcrest-mesh = { path = "crates/stagcrest-mesh" }
stagcrest-circuit = { path = "crates/stagcrest-circuit" }
stagcrest-mod-sdk = { path = "crates/stagcrest-mod-sdk" }
stagcrest-mod-server = { path = "crates/stagcrest-mod-server" }
stagcrest-mod-client = { path = "crates/stagcrest-mod-client" }
stagcrest-net = { path = "crates/stagcrest-net" }
stagcrest-server = { path = "crates/stagcrest-server" }
stagcrest-client = { path = "crates/stagcrest-client" }
stagcrest-render = { path = "crates/stagcrest-render" }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
