name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            exe_ext: ""
          - os: macos-latest
            platform: macos-aarch64
            exe_ext: ""
          - os: windows-latest
            platform: windows-x86_64
            exe_ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libudev-dev libasound2-dev libfontconfig-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-tools
        run: cargo install wasm-tools --locked
      - name: Build core mod
        shell: bash
        run: bash scripts/build-core-mod.sh
      - name: Build workspace
        shell: bash
        run: |
          cargo build -p stagcrest-client --release --no-default-features
          cargo build -p stagcrest-server --release
          cargo test -p stagcrest-net
          cargo test -p stagcrest-mod-server host::tests::core_mod_time_command_sets_world_time
      - name: Package nightly
        if: github.event_name == 'push'
        shell: bash
        run: bash scripts/package-nightly.sh "${{ matrix.platform }}" "${{ matrix.exe_ext }}"
      - name: Upload nightly package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: stagcrest-nightly-${{ matrix.platform }}
          path: dist/stagcrest-nightly-${{ matrix.platform }}.*
          retention-days: 1
          if-no-files-found: error

  publish-nightly:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stagcrest-nightly-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/stagcrest-nightly-*.tar.gz dist/stagcrest-nightly-*.zip)
          if ((${#files[@]} != 3)); then
            echo "Expected 3 platform archives, found ${#files[@]}: ${files[*]}"
            ls -laR dist
            exit 1
          fi

          {
            echo "Automated nightly build from [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "Download the archive for your platform below, extract, and run \`stagcrest-client\` from that folder (see \`RUN.txt\`)."
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Linux x86_64 | \`stagcrest-nightly-linux-x86_64.tar.gz\` |"
            echo "| macOS Apple Silicon | \`stagcrest-nightly-macos-aarch64.tar.gz\` |"
            echo "| Windows x86_64 | \`stagcrest-nightly-windows-x86_64.zip\` |"
          } > release-notes.md

          gh release delete nightly --yes 2>/dev/null || true

          gh release create nightly \
            "${files[@]}" \
            --prerelease \
            --title "Nightly" \
            --target "${GITHUB_SHA}" \
            --notes-file release-notes.md
