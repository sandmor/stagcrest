name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build core mod
        run: bash scripts/build-core-mod.sh
      - name: Build workspace
        run: |
          cargo build -p stagcrest-client --release
          cargo build -p stagcrest-server --release
          cargo test -p stagcrest-net
