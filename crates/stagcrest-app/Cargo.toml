[package]
name = "stagcrest-app"
version.workspace = true
edition.workspace = true

[lib]
name = "stagcrest_app"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stagcrest"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true, features = ["dynamic_linking"] }
stagcrest-protocol.workspace = true
stagcrest-world.workspace = true
stagcrest-mesh.workspace = true
stagcrest-circuit.workspace = true
stagcrest-mod-host.workspace = true
stagcrest-render.workspace = true
stagcrest-storage.workspace = true
glam.workspace = true
tracing.workspace = true
futures-lite = "2.6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stagcrest-mesh = { workspace = true, features = ["parallel"] }
stagcrest-storage = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
stagcrest-storage = { workspace = true }
tracing-wasm = "0.2"
futures-lite = "2.6"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }

[features]
default = []
wasm = []
