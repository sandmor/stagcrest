[package]
name = "stagcrest-client"
version.workspace = true
edition.workspace = true

[[bin]]
name = "stagcrest-client"
path = "src/main.rs"

[features]
default = ["bevy-dynamic-linking"]
# Faster local iteration; disable with `cargo build --no-default-features` for distributable binaries.
bevy-dynamic-linking = ["bevy/dynamic_linking"]

[dependencies]
bevy.workspace = true
stagcrest-protocol.workspace = true
stagcrest-world.workspace = true
stagcrest-mesh.workspace = true
stagcrest-circuit.workspace = true
stagcrest-mod-client.workspace = true
stagcrest-render.workspace = true
stagcrest-storage.workspace = true
stagcrest-net.workspace = true
stagcrest-server.workspace = true
stagcrest-minimap.workspace = true
glam.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-lite.workspace = true
clap.workspace = true
tokio.workspace = true
